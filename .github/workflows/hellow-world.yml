name: Hello World Webhook Test

on:
  repository_dispatch:
    types: [upstream-push]
  workflow_dispatch:
    inputs:
      message:
        description: 'Test message'
        required: false
        default: 'Hello from manual trigger!'

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
    - name: Say Hello
      run: |
        echo "🎉 Hello World! Workflow triggered successfully!"
        echo "Event type: ${{ github.event_name }}"
        echo "Repository: ${{ github.repository }}"
        echo "Triggered by: ${{ github.actor }}"
        echo "Timestamp: $(date)"
        
    - name: Show manual input
      if: github.event_name == 'workflow_dispatch'
      run: |
        echo "Manual trigger message: ${{ github.event.inputs.message }}"
        
    - name: Show webhook payload
      if: github.event_name == 'repository_dispatch'
      run: |
        echo "Webhook payload received:"
        echo '${{ toJson(github.event.client_payload) }}'