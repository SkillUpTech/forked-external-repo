name: Auto Sync with Upstream

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    outputs:
      sync_result: ${{ steps.sync.outputs.result }}
      changes_detected: ${{ steps.check.outputs.needs_sync }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Check for upstream changes
      id: check
      run: |
        git remote add upstream https://github.com/rrochati/external-repo-test.git
        git fetch upstream
        git checkout dev || git checkout -b dev origin/dev
        
        if ! git merge-base --is-ancestor upstream/main HEAD; then
          echo "needs_sync=true" >> $GITHUB_OUTPUT
          echo "📝 New commits detected in upstream"
        else
          echo "needs_sync=false" >> $GITHUB_OUTPUT
          echo "✅ Already up to date"
        fi
    
    - name: Configure Git
      if: steps.check.outputs.needs_sync == 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.com"

    - name: Sync changes
      id: sync
      if: steps.check.outputs.needs_sync == 'true'
      run: |
        if git merge upstream/main --no-edit; then
          git push origin dev
          echo "✅ Synced dev branch with upstream"
          echo "result=success" >> $GITHUB_OUTPUT
        else
          echo "❌ Merge conflict detected"
          echo "result=conflict" >> $GITHUB_OUTPUT
          exit 1
        fi

  notify:
    runs-on: ubuntu-latest
    needs: check-and-sync
    if: always() && needs.check-and-sync.outputs.changes_detected == 'true'
    steps:
    - name: Send email notification
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.office365.com
        server_port: 587
        username: ${{ secrets.MAIL_USERNAME }}
        password: ${{ secrets.MAIL_PASSWORD }}
        subject: 'Upstream Sync ${{ needs.check-and-sync.outputs.sync_result == ''success'' && ''✅ Completed'' || ''❌ Failed'' }} - ${{ github.repository }}'
        to: ${{ vars.NOTIFICATION_EMAIL }}
        from: GitHub Actions <${{ secrets.MAIL_USERNAME }}>
        body: |
          Hello,
          
          The upstream sync workflow has completed for repository: ${{ github.repository }}
          
          📊 **Sync Details:**
          - Status: ${{ needs.check-and-sync.outputs.sync_result == 'success' && '✅ Success' || '❌ Failed' }}
          - Timestamp: ${{ github.event.head_commit.timestamp || 'Manual trigger' }}
          - Workflow: ${{ github.workflow }}
          - Run ID: ${{ github.run_id }}
          
          🔗 **View Details:**
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          📝 **Changes:**
          ${{ needs.check-and-sync.outputs.sync_result == 'success' && 'Dev branch successfully synced with upstream changes.' || 'Merge conflicts detected. Manual intervention required.' }}
          
          ---
          This is an automated message from GitHub Actions.